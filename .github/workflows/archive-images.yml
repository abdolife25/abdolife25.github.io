name: Archive Blogger images into the repo
# Run once by hand (Actions tab > Run workflow). Saves every image into the repo so the
# site never depends on Blogger's image servers again.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/download-images.mjs
      - name: Commit archived images
        run: |
          git config user.name "voyagelo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/images src/content
          git diff --cached --quiet || git commit -m "Archive Blogger images into the repo"
          git push
